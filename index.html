<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drive"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex"><link rel="apple-touch-icon" href="icon.png">
<style>[hidden]{display:none!important}body{margin:0}.app{padding-top:calc(20px + env(safe-area-inset-top,0px))!important}</style>
<title>Drive Dashboard</title>
<style>
/* Layout: a bento of liquid glass objects over a slowly moving colour field; one floating glass capsule of tabs at the thumb. */
:root{
  color-scheme:light;
  --ink:#16181d;--mute:#59616e;--faint:#8a92a0;--hair:rgba(30,50,90,.09);
  --acc:#0a6cff;--acc2:#38a8ff;--good:#14804a;--warn:#b35a00;
  --blur:30px;--fill-a:.6;--fill-b:.26;
  --c0:#eef4fb;--c1:#a8d3ff;--c2:#d4ccff;--c3:#b6ecf3;--c4:#e8ecff;
  --photo:none;
  --scale:1;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --spring:cubic-bezier(.3,1.5,.5,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--c0);color:var(--ink);font:400 calc(16px*var(--scale))/1.36 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* Colour field */
.field{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--c0)}
.field i{position:absolute;display:block;border-radius:50%;filter:blur(46px);opacity:.85;animation:drift 26s ease-in-out infinite alternate}
.field .o1{width:78vmax;height:78vmax;max-width:760px;max-height:760px;top:-24%;right:-30%;background:var(--c1)}
.field .o2{width:66vmax;height:66vmax;max-width:640px;max-height:640px;top:18%;left:-34%;background:var(--c2);animation-delay:-8s}
.field .o3{width:70vmax;height:70vmax;max-width:680px;max-height:680px;top:52%;right:-32%;background:var(--c3);animation-delay:-15s}
.field .o4{width:70vmax;height:70vmax;max-width:680px;max-height:680px;bottom:-30%;left:-20%;background:var(--c4);animation-delay:-21s}
.field b{position:absolute;inset:0;background-image:var(--photo);background-size:cover;background-position:center}
@keyframes drift{from{transform:translate3d(-4%,-3%,0) scale(1)}to{transform:translate3d(5%,4%,0) scale(1.1)}}

/* Liquid glass */
.glass{position:relative;isolation:isolate;
  background:linear-gradient(140deg,rgba(255,255,255,var(--fill-a)),rgba(255,255,255,var(--fill-b)));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(210%) brightness(1.05);backdrop-filter:blur(var(--blur)) saturate(210%) brightness(1.05);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.98),inset 0 -1.5px 2px rgba(255,255,255,.5),inset 0 0 18px rgba(255,255,255,.32),inset 0 -16px 22px -18px color-mix(in srgb,var(--acc2) 42%,transparent),0 24px 46px -20px color-mix(in srgb,var(--acc) 38%,rgba(30,40,90,.5)),0 3px 8px rgba(35,60,120,.07);
  border-radius:28px}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:2;
  background:linear-gradient(135deg,#fff,color-mix(in srgb,var(--acc2) 30%,rgba(255,255,255,.5)) 26%,rgba(255,255,255,.08) 52%,rgba(255,200,235,.42) 76%,#fff);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(150px 110px at var(--mx,22%) var(--my,0%),rgba(255,255,255,.72),transparent 72%),radial-gradient(180px 80px at 86% 112%,rgba(255,255,255,.34),transparent 72%)}
.press{transition:transform .28s var(--spring)}
.press:active{transform:scale(.965)}

.app{max-width:560px;margin:0 auto;min-height:100%;padding-block:20px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0 2px 2px}
.top h1{font-size:calc(31px*var(--scale));font-weight:700;letter-spacing:-.026em;line-height:1.07;text-wrap:balance}
.top p{margin-top:4px;color:var(--mute);font-size:15px}
.pill{flex:none;font-weight:600;font-size:12px;color:var(--acc);padding:6px 12px;border-radius:999px}
.sect{font-weight:600;font-size:14px;color:var(--mute);margin:9px 4px -3px}

/* Premium filled icon */
.ico{flex:none;display:block;width:42px;height:42px;filter:drop-shadow(0 5px 6px rgba(25,40,90,.26))}
.ico.lg{width:58px;height:58px}
.ico.sm{width:26px;height:26px;filter:drop-shadow(0 2px 3px rgba(25,40,90,.25))}
.qbtn.lead .ico{filter:none}

/* Bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.full{grid-column:1/-1}

/* Weather */
.wx{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.wx-top{display:flex;align-items:center;gap:13px}
.sun{flex:none;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#fff3b8,#ffc93f 56%,#ff9d1e);box-shadow:0 0 26px 6px rgba(255,190,60,.42),inset 0 1px 2px #fff}
.sun.rain{background:radial-gradient(circle at 36% 32%,#e8f4ff,#8ebef0 60%,#5a8cd0);box-shadow:0 0 22px 4px rgba(90,140,210,.4)}
.temp{font-weight:200;font-size:calc(52px*var(--scale));line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.wx-tx{flex:1;min-width:0}
.wx-tx b{display:block;font-size:19px;font-weight:600;letter-spacing:-.015em}
.wx-tx span{display:block;font-size:13.5px;color:var(--mute)}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hour{padding:8px 10px;border-radius:15px;background:rgba(255,255,255,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.hour b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.ok{font-size:15px;font-weight:600;color:var(--good)}
.wx.alert{background:linear-gradient(140deg,rgba(255,222,176,.8),rgba(255,196,130,.5))}
.wx.alert .ok{color:var(--warn)}

/* Route hero */
.route{display:flex;flex-direction:column;gap:13px;padding:17px 18px 16px;color:#fff;
  background:linear-gradient(145deg,color-mix(in srgb,var(--acc2) 84%,transparent),color-mix(in srgb,var(--acc) 90%,transparent));
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 -2px 6px rgba(255,255,255,.18),0 26px 44px -16px color-mix(in srgb,var(--acc) 62%,transparent)}
.route::after{background:radial-gradient(190px 110px at var(--mx,18%) var(--my,0%),rgba(255,255,255,.42),transparent 72%)}
.route small{font-size:13px;font-weight:600;opacity:.88}
.route h2{font-size:calc(25px*var(--scale));font-weight:700;letter-spacing:-.024em;line-height:1.1;margin-top:2px}
.stops{position:relative;display:grid;grid-template-columns:repeat(5,1fr);padding-top:17px}
.stops::before{content:"";position:absolute;left:10%;right:10%;top:21px;height:3.5px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.6),#fff)}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:500;text-align:center;line-height:1.15;min-width:0}
.stop i{display:block;width:11px;height:11px;border-radius:3.5px;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.route-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.metric{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.metric b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.metric span{font-size:12px;opacity:.85}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:23px;font-weight:600;font-size:16px;color:var(--acc);background:rgba(255,255,255,.93);box-shadow:inset 0 1px 0 #fff,0 8px 18px -6px rgba(0,30,90,.45)}

/* Music */
.music{padding:15px 16px;display:flex;flex-direction:column;gap:13px}
.music-top{display:flex;align-items:center;gap:13px}
.art{flex:none;position:relative;width:60px;height:60px;border-radius:17px;background:linear-gradient(150deg,#ff6b6f,#e5202e 60%,#a80f1a);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 18px -6px #e5202e;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:13px;overflow:hidden}
.art i{display:block;width:4px;height:30%;border-radius:2px;background:#fff}
.playing .art i{animation:eq 1s ease-in-out infinite alternate}
.art i:nth-child(2){height:58%;animation-delay:-.3s}.art i:nth-child(3){height:82%;animation-delay:-.6s}.art i:nth-child(4){height:46%;animation-delay:-.15s}
@keyframes eq{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
.art i{transform-origin:bottom}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:calc(17px*var(--scale));font-weight:600;letter-spacing:-.014em;line-height:1.2}
.tx span{display:block;font-size:13.5px;color:var(--mute);margin-top:1px}
.ctrl{display:flex;gap:9px}
.round{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:var(--ink);background:rgba(255,255,255,.62);box-shadow:inset 0 1px 0 #fff,0 5px 12px -5px rgba(30,50,100,.32)}
.round svg{width:21px;height:21px}
.round.main{color:#fff;background:radial-gradient(circle at 34% 24%,#ff8f8f,#e5202e 62%,#b3121d);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 16px -6px #e5202e}

/* Small squares */
.tile{padding:14px;min-height:144px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0}
.tile b{display:block;font-size:calc(17px*var(--scale));font-weight:600;letter-spacing:-.014em;line-height:1.17}
.tile span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sw{flex:none;position:relative;display:block;width:52px;height:31px;border-radius:16px;background:rgba(110,125,150,.26);box-shadow:inset 0 1px 3px rgba(20,30,60,.2);transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:linear-gradient(#fff,#f0f3f8);box-shadow:0 3px 7px rgba(10,20,50,.3);transition:transform .32s var(--spring)}
[aria-pressed=true]>.sw,[aria-pressed=true] .sw{background:#30c85c}
[aria-pressed=true]>.sw::after,[aria-pressed=true] .sw::after{transform:translateX(21px)}

/* Control tiles */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.cat{aspect-ratio:1/1.02;padding:12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;border-radius:24px}
.cat b{font-weight:600;font-size:14.5px;line-height:1.15;letter-spacing:-.012em;overflow-wrap:anywhere}

/* Screen head */
.backbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:3px;min-height:42px;padding:0 15px 0 9px;border-radius:21px;font-weight:600;font-size:15px;color:var(--acc)}
.backbtn svg{width:20px;height:20px}
.head{padding:17px 18px;display:flex;align-items:center;gap:14px;background:linear-gradient(140deg,color-mix(in srgb,var(--a) 30%,rgba(255,255,255,.62)),rgba(255,255,255,.3))}
.head h1{font-size:calc(29px*var(--scale));font-weight:700;letter-spacing:-.026em;line-height:1.08}
.head p{color:var(--mute);font-size:14.5px;margin-top:2px}

/* Rows */
.list{display:flex;flex-direction:column}
.line{display:flex;align-items:center;gap:13px;min-height:72px;padding:11px 15px;width:100%;border-bottom:1px solid var(--hair)}
.line:last-child{border-bottom:0}
.val{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.val b{display:block;font-size:16px;font-weight:600;letter-spacing:-.012em}
.val span{font-size:13px;color:var(--mute)}
.chev{flex:none;width:17px;height:17px;color:#a2aab7}
.note{padding:0 2px;color:var(--mute);font-size:14.5px}
.flag{padding:14px 16px;font-size:14.5px;color:var(--ink)}
.flag b{font-weight:600;color:var(--acc)}

/* Map cards */
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.mapc{padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0;border-radius:24px}
.mapc b{font-size:14.5px;font-weight:600;line-height:1.14;letter-spacing:-.01em}
.mapc span{display:block;font-size:12px;color:var(--mute);line-height:1.25;margin-top:2px}

/* Form */
.form{padding:15px;display:flex;flex-direction:column;gap:10px}
.form h3{font-size:18px;font-weight:600;letter-spacing:-.016em}
.field-in{display:block;width:100%;min-height:50px;padding:0 16px;border:0;border-radius:17px;background:rgba(255,255,255,.62);box-shadow:inset 0 1px 3px rgba(20,40,80,.12),inset 0 -1px 0 rgba(255,255,255,.7)}
.field-in::placeholder{color:var(--faint)}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:25px;font-weight:600;color:#fff;background:linear-gradient(160deg,var(--acc2),var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 22px -10px var(--acc)}
.btn[aria-disabled=true]{opacity:.42;pointer-events:none}

/* Check row */
.check{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 15px;width:100%;border-bottom:1px solid var(--hair);font-weight:500}
.check:last-child{border-bottom:0}
.tick{flex:none;display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:rgba(255,255,255,.62);box-shadow:inset 0 1px 3px rgba(20,40,80,.16);color:transparent}
.tick svg{width:17px;height:17px}
[aria-pressed=true] .tick{background:linear-gradient(160deg,#4dd97b,#22b04e);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.progress{height:7px;border-radius:4px;background:rgba(255,255,255,.55);box-shadow:inset 0 1px 2px rgba(20,40,80,.14);overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#4dd97b,#22b04e);transition:width .4s var(--spring)}
.prog-head{padding:14px 15px 13px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--hair);font-weight:600}

/* Car card */
.carcard{padding:17px 18px;display:flex;flex-direction:column;gap:12px}
.carcard svg{width:100%;max-width:300px;height:auto;align-self:center;color:var(--ink)}
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spec div{padding:8px 10px;border-radius:15px;background:rgba(255,255,255,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);font-size:12px;color:var(--mute)}
.spec b{display:block;font-size:14.5px;color:var(--ink);font-weight:600}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:calc(11px + env(safe-area-inset-bottom,0px));z-index:5;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs>div{pointer-events:auto;max-width:390px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px;border-radius:32px;--fill-a:.72;--fill-b:.46}
.tab{min-height:56px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:600;color:#3d4450;text-align:center;transition:background .25s,color .25s}
.tab svg{width:23px;height:23px}
.tab[aria-current=page]{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,rgba(255,255,255,.5));box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;width:min(calc(100% - 32px),460px);padding:13px 17px;border-radius:21px;font-weight:500;font-size:15px;--fill-a:.92;--fill-b:.8}

/* Car screen */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:5px;border-radius:24px}
.seg button{min-height:48px;border-radius:19px;text-align:center;font-weight:600;font-size:15px;letter-spacing:-.01em;color:#3d4450;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{color:var(--acc);background:rgba(255,255,255,.92);box-shadow:0 4px 12px -4px rgba(30,50,100,.4),inset 0 1px 0 #fff}
.device{padding:9px;border-radius:30px;background:linear-gradient(160deg,#3a3f48,#17191e 55%,#0b0c10);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 26px 42px -16px rgba(10,15,40,.6)}
.device.car{padding:13px 11px 16px;border-radius:26px}
.cp{position:relative;display:flex;width:100%;aspect-ratio:var(--ratio,2.17);border-radius:21px;overflow:hidden;container-type:inline-size;background:var(--c0);isolation:isolate}
.device.car .cp{--ratio:2.67;border-radius:8px}
.cp .bg{position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 90% at 90% 0,var(--c1),transparent 70%),radial-gradient(60% 90% at 6% 40%,var(--c2),transparent 70%),radial-gradient(60% 90% at 82% 100%,var(--c3),transparent 70%),radial-gradient(60% 90% at 28% 100%,var(--c4),transparent 70%),var(--c0)}
.cp .bgp{position:absolute;inset:0;z-index:-1;background-image:var(--photo);background-size:cover;background-position:center}
.bar{flex:none;width:9cqw;margin:1cqw 0 1cqw 1cqw;display:flex;flex-direction:column;align-items:center;gap:.6cqw;padding:1.2cqw 0;border-radius:3.2cqw;background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.34));box-shadow:inset 0 .14cqw .1cqw #fff,inset 0 0 1.4cqw rgba(255,255,255,.45),0 1cqw 2.4cqw -1cqw rgba(30,50,110,.45);-webkit-backdrop-filter:blur(18px) saturate(200%);backdrop-filter:blur(18px) saturate(200%)}
.bar.right{order:3;margin:1cqw 1cqw 1cqw 0}
.bar em{font-style:normal;font-weight:600;font-size:2.2cqw;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:.3cqw 0 .5cqw}
.bar .fill{flex:1}
.bbtn{display:grid;place-items:center;width:7.4cqw;height:7.4cqw;border-radius:50%;transition:background .2s}
.bbtn .ico{width:5.7cqw;height:5.7cqw;filter:drop-shadow(0 .3cqw .4cqw rgba(25,40,90,.3))}
.bbtn.on{background:rgba(255,255,255,.92);box-shadow:0 .4cqw 1cqw -.3cqw rgba(30,50,110,.5),inset 0 .1cqw 0 #fff}
.cp-main{position:relative;flex:1;display:grid;gap:1cqw;padding:1cqw;min-height:0;min-width:0}
.cp-main.none{padding:0;gap:0}
.lay-full{grid-template:"a" 1fr/1fr}.lay-two{grid-template:"a b" 1fr/1fr 1fr}.lay-focus{grid-template:"a b" 1fr "a c" 1fr/62% 1fr}.lay-quad{grid-template:"a b" 1fr "c d" 1fr/1fr 1fr}
.pn{position:relative;overflow:hidden;min-height:0;min-width:0;border-radius:2.8cqw;padding:1.7cqw;display:flex;flex-direction:column;justify-content:space-between;gap:.6cqw;color:#fff;box-shadow:inset 0 .14cqw .1cqw rgba(255,255,255,.72),inset 0 0 1.4cqw rgba(255,255,255,.14),0 1.2cqw 2.6cqw -1.1cqw rgba(20,30,80,.55)}
.none .pn.solo{border-radius:0;box-shadow:none}
.pn::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 55% at 22% 0,rgba(255,255,255,.34),transparent 70%)}
.pn>*{position:relative}
.pn small{font-size:1.6cqw;font-weight:600;opacity:.92}
.pn h4{margin:0;font-weight:600;font-size:2.35cqw;letter-spacing:-.018em;line-height:1.12}
.pn p{margin:.2cqw 0 0;font-size:1.55cqw;opacity:.9;line-height:1.2}
.pn.big h4{font-size:3.5cqw}.pn.big small{font-size:1.9cqw}.pn.big p{font-size:1.95cqw}
.pn.solo{padding:2.8cqw 3.4cqw}
.pn.solo h4{font-size:5cqw}.pn.solo small{font-size:2.2cqw}.pn.solo p{font-size:2.3cqw}
.pn-top{display:flex;align-items:center;justify-content:space-between;gap:1cqw}

/* Music */
.pn.music{color:var(--ink);background:rgba(255,255,255,.5);isolation:isolate}
.pn.music::before{display:none}

.pn.music::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.5),rgba(255,255,255,.3))}
.mcover{position:relative;flex:none;aspect-ratio:1;border-radius:3cqw;overflow:hidden;box-shadow:0 2.4cqw 4.6cqw -1.8cqw rgba(30,40,90,.6),inset 0 0 0 .15cqw rgba(255,255,255,.65)}

.m-immersive.solo .mbg{inset:0;filter:none}

.mglass{position:relative;margin:2.2cqw;padding:1.5cqw 2.2cqw;border-radius:3.6cqw;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2.6cqw;background:linear-gradient(140deg,rgba(255,255,255,.82),rgba(255,255,255,.52));box-shadow:inset 0 .16cqw .1cqw #fff,inset 0 0 1.6cqw rgba(255,255,255,.5),0 2cqw 4cqw -1.6cqw rgba(20,40,100,.6);-webkit-backdrop-filter:blur(22px) saturate(200%);backdrop-filter:blur(22px) saturate(200%)}

.upload{position:relative;flex:none;width:82px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:500;text-align:center;cursor:pointer}
.upload i{display:grid;place-items:center;aspect-ratio:.66;border-radius:19px;background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9);color:var(--acc)}
.upload svg{width:26px;height:26px}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.opt{padding:14px 15px;display:flex;flex-direction:column;gap:11px;border-bottom:1px solid var(--hair)}
.opt:last-child{border-bottom:0}
.opt>b{font-weight:600;font-size:16px;letter-spacing:-.012em}
.opt>span{font-size:13.5px;color:var(--mute);margin-top:-8px}
.accents{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.accent{aspect-ratio:1;border-radius:14px;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 5px 10px -4px var(--b);transition:transform .28s var(--spring)}
.accent[aria-pressed=true]{transform:scale(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 2.5px #fff,0 0 0 5px var(--b)}
.segin{background:rgba(255,255,255,.36);box-shadow:inset 0 1px 3px rgba(20,40,80,.12)}
.edit{display:flex;align-items:center;gap:9px;min-height:66px;padding:9px 10px 9px 13px;border-bottom:1px solid var(--hair)}
.edit:last-child{border-bottom:0}
.edit b{flex:1;font-weight:600;font-size:16px;letter-spacing:-.012em;min-width:0}
.edit.off .sq{filter:grayscale(1);opacity:.5}
.edit.off b{color:var(--faint)}
.mini{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.62);box-shadow:inset 0 1px 0 #fff,0 3px 8px -4px rgba(30,50,100,.3);display:grid;place-items:center;color:var(--acc)}
.mini svg{width:18px;height:18px}
.mini:disabled{opacity:.34;cursor:default}
.mini[aria-pressed=true]{color:var(--faint)}
.textbtn{align-self:center;min-height:44px;padding:0 15px;color:var(--acc);font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

 const homeRows=S.home.map((id,i)=>{const h=HOME.find(x=>x[0]===id),off=S.homeHidden.includes(id),can=SIZABLE.includes(id);return `<div class="edit ${off?'off':''} ${can?'hassz':''}">${sq(h[2])}<b>${h[1]}</b>
  <button class="mini" data-hmove="${i},-1" aria-label="Move ${h[1]} up" ${i===0?'disabled':''}>${svg('up')}</button>
  <button class="mini" data-hmove="${i},1" aria-label="Move ${h[1]} down" ${i===S.home.length-1?'disabled':''}>${svg('down')}</button>
  <button class="mini" data-hhide="${id}" aria-label="${off?'Show':'Hide'} ${h[1]}" aria-pressed="${off}">${svg('eye')}</button></div>
  ${can?`<div class="sz" role="group" aria-label="${h[1]} size">${[['s','Small'],['m','Medium'],['l','Large']].map(o=>`<button data-size="${id},${o[0]}" aria-pressed="${(S.sizes[id]||'m')===o[0]}">${o[1]}</button>`).join('')}</div>`:''}`}).join('');
 const rows=S.order.map((id,i)=>{const c=CATS.find(x=>x.id===id),off=S.hidden.includes(id);return `<div class="edit ${off?'off':''}">${sq(c.i)}<b>${c.n}</b>
  <button class="mini" data-move="${i},-1" aria-label="Move ${c.n} up" ${i===0?'disabled':''}>${svg('up')}</button>
  <button class="mini" data-move="${i},1" aria-label="Move ${c.n} down" ${i===S.order.length-1?'disabled':''}>${svg('down')}</button>
  <button class="mini" data-hide="${id}" aria-label="${off?'Show':'Hide'} ${c.n}" aria-pressed="${off}">${svg('eye')}</button></div>`}).join('');
 const themes=Object.entries(THEMES).map(([k,t])=>{const wk=k==='auto'?autoTheme()[0]:t[2],ak=k==='auto'?autoTheme()[1]:t[3],v=WALLS[wk],c=ACCENTS[ak];return `<button class="theme" data-theme-k="${k}" aria-pressed="${S.theme===k}"><i style="background:${wallSwatch(wk,v)};--ta:${c[0]};--tb:${c[1]}"><u></u></i>${t[0]}<small>${t[1]}</small></button>`}).join('');
 return `<header class="top"><div><h1>Customize</h1><p>Make it yours from your phone</p></div></header>
 <p class="sect">Colour Theme</p>
 <section class="glass"><div class="themes">${themes}</div></section>
 <p class="note">A theme sets wallpaper, accent and glass together, so they always match. Auto follows the time of day and turns to Ocean when rain is likely.</p>
 <p class="sect">Wallpaper</p>
 <section class="glass"><div class="walls">${walls}${up}</div></section>
 <p class="sect">Look</p>
 <section class="glass">
  <div class="opt"><b>Accent Colour</b><div class="accents">${accents}</div></div>
  <div class="opt"><b>Glass</b>${seg('glass',S.glass,[['clear','Clear'],['balanced','Balanced'],['frosted','Frosted']])}</div>
  <div class="opt"><b>Text Size</b>${seg('text',S.text,[['standard','Standard'],['large','Large']])}</div>
 </section>
 <p class="sect">Home Widgets</p>
 <section class="glass">${homeRows}</section>
 <p class="sect">All Controls</p>
 <section class="glass"><div class="opt"><b>Tile Size</b>${seg('tiles',String(S.tiles||3),[['4','Small'],['3','Medium'],['2','Large']])}</div>${rows}</section>
 <p class="sect">Preview</p>
 <section class="glass"><button class="switch" style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:10px 16px;width:100%;font-weight:500" id="alertSw" aria-pressed="${S.alert}"><span>Show Sample Rain Alert</span><span class="sw"></span></button></section>
 <button class="textbtn" id="reset">Reset to Default</button>`;
}
function tabs(){
 const t=[['home','Dashboard','grid'],['carplay','Car Screen','car'],['customize','Customize','sliders']];
 document.getElementById('tabs').innerHTML=t.map(x=>`<button class="tab" data-view="${x[0]}" ${(view===x[0]||(view==='cat'&&x[0]==='home'))?'aria-current="page"':''}>${sq(x[2],null,'sm')}${x[1]}</button>`).join('');
}
function render(){theme();app.innerHTML=view==='cat'?category():view==='carplay'?carplay():view==='customize'?customize():home();tabs();overlay()}
function swap(arr,i,d){[arr[i],arr[i+d]]=[arr[i+d],arr[i]]}
function planUpdate(){
 const d=document.getElementById('dest'),v=document.getElementById('via'),a=document.getElementById('planGo');if(!d||!a)return;
 const dest=d.value.trim(),stops=v.value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,3);
 if(!dest){a.removeAttribute('href');a.setAttribute('aria-disabled','true');return}
 a.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+(stops.length?'&waypoints='+stops.map(encodeURIComponent).join('%7C'):'')+'&travelmode=driving&dir_action=navigate';
 a.setAttribute('aria-disabled','false');
}
document.addEventListener('input',planUpdate);
document.addEventListener('submit',e=>{if(e.target.id!=='placeForm')return;e.preventDefault();const i=document.getElementById('placeIn'),n=i.value.trim();if(!n)return;S.places=S.places.concat({n,u:'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(n)+'&travelmode=driving&dir_action=navigate'});save();render();toast('Place saved.')});
document.addEventListener('pointermove',e=>{const g=e.target.closest&&e.target.closest('.glass');if(!g)return;const r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px')},{passive:true});
document.addEventListener('click',e=>{
 const b=e.target.closest('button,.thumb');if(!b)return;const d=b.dataset;
 const top=()=>scrollTo(0,0);
 if(d.goscreen!==undefined){S.cur=+d.goscreen;S.carTab='phone';view='carplay';save();render();top()}
 else if(d.view){view=d.view;render();top()}
 else if(d.cat){catId=d.cat;view='cat';render();top()}
 else if(b.id==='goBack'){view='home';render();top()}
 else if(d.toast){toast(d.toast)}
 else if(d.do){act(d.do)}
 else if(d.act==='drive'){S.drive=!S.drive;save();act('drive')}
 else if(d.act==='play'){S.playing=!S.playing;save();render();act('play')}
 else if(d.move){const[i,n]=d.move.split(',').map(Number);swap(S.order,i,n);save();render()}
 else if(d.hmove){const[i,n]=d.hmove.split(',').map(Number);swap(S.home,i,n);save();render()}
 else if(d.hide){S.hidden=S.hidden.includes(d.hide)?S.hidden.filter(x=>x!==d.hide):S.hidden.concat(d.hide);save();render()}
 else if(d.hhide){S.homeHidden=S.homeHidden.includes(d.hhide)?S.homeHidden.filter(x=>x!==d.hhide):S.homeHidden.concat(d.hhide);save();render()}
 else if(d.themeK){S.theme=d.themeK;if(d.themeK!=='auto'){const t=THEMES[d.themeK];S.wall=t[2];S.accent=t[3];S.glass=t[4]}save();render();}
 else if(d.wall){S.theme='custom';S.wall=d.wall;save();render()}
 else if(d.accent){S.theme='custom';S.accent=d.accent;save();render()}
 else if(d.glass){S.theme='custom';S.glass=d.glass;save();render()}
 else if(d.text){S.text=d.text;save();render()}
 else if(d.cartab){S.carTab=d.cartab;save();render()}
 else if(d.cppage){S.cpPage=d.cppage;save();render()}
 else if(d.goto!==undefined){S.cur=+d.goto;save();render()}
 else if(d.gostep){S.cur=(S.cur+ +d.gostep+S.screens.length)%S.screens.length;save();render()}
 else if(d.lay){const sc=S.screens[S.cur],need=LAYS.find(l=>l[0]===d.lay)[2].length;sc.lay=d.lay;sc.w=sc.w.filter(Boolean).slice(0,need);if(d.lay==='float'&&!MAPMAIN.includes(sc.w[0])){const m=sc.w.indexOf('map');if(m>0)sc.w.splice(m,1);sc.w.unshift('map');sc.w=sc.w.slice(0,3)}for(const w of Object.keys(WIDGETS)){if(sc.w.length>=need)break;if(!sc.w.includes(w))sc.w.push(w)}save();render()}
 else if(d.p2){S.screens[S.cur].p2=d.p2;save();render()}
 else if(d.p3){S.screens[S.cur].p3=d.p3;save();render()}
 else if(d.msrc){S.msrc=d.msrc;save();render()}
 else if(d.act==='like'){S.liked=!S.liked;save();render()}
 else if(d.size){const[id,v]=d.size.split(',');S.sizes=Object.assign({},S.sizes,{[id]:v});save();render()}
 else if(d.tiles){S.tiles=+d.tiles;save();render()}
 else if(d.ms){S.screens[S.cur].ms=+d.ms;save();render()}
 else if(d.s2){S.screens[S.cur].s2=d.s2;save();render()}
 else if(d.s3){S.screens[S.cur].s3=d.s3;save();render()}
 else if(d.delplace!==undefined){S.places.splice(+d.delplace,1);save();render()}
 else if(d.mtabs){S.mtabs=+d.mtabs;save();render()}
 else if(d.mdock){const[k,w]=d.mdock.split(',');const o=S.mdock.indexOf(w);if(o>=0&&o!==+k)S.mdock[o]=S.mdock[k];S.mdock[k]=w;save();render()}
 else if(d.mstyle){S.mstyle=d.mstyle;save();render()}
 else if(d.look){S.screens[S.cur].look=d.look;save();render()}
 else if(d.bars){S.screens[S.cur].bars=d.bars;save();render()}
 else if(d.w){const[k,id]=d.w.split(',');const sc=S.screens[S.cur];if(id==='none'){sc.w[k]=null}else{const o=sc.w.indexOf(id);if(o>=0&&o!==+k)sc.w[o]=sc.w[k];sc.w[k]=id}save();render()}
 else if(d.swall!==undefined){S.screens[S.cur].wall=d.swall||null;save();render()}
 else if(d.smove){const n=+d.smove,a=S.screens,c=S.cur;[a[c],a[c+n]]=[a[c+n],a[c]];S.cur=c+n;save();render()}
 else if(b.id==='addScreen'){const used=S.screens.map(x=>x.w[0]),w=Object.keys(WIDGETS).find(x=>!used.includes(x))||'clock';S.screens.push({lay:'full',bars:'none',w:[w],wall:null});S.cur=S.screens.length-1;save();render();toast('Screen added. Choose its layout below.')}
 else if(b.id==='delScreen'){if(S.screens.length>1){S.screens.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);save();render();toast('Screen removed.')}}
 else if(b.id==='sheetBtn'){sheet=!sheet;overlay()}
 else if(d.check){const[k,id]=d.check.split(',');S[k]=S[k].includes(id)?S[k].filter(x=>x!==id):S[k].concat(id);save();render()}
 else if(b.id==='expand'){full=true;sheet=false;overlay()}
 else if(b.closest('#closeFull')||b.id==='closeFull'){full=false;overlay()}
 else if(b.id==='alertSw'){S.alert=!S.alert;save();render()}
 else if(b.id==='reset'){S=defaults();save();render();top();toast('Dashboard reset.')}
});
document.addEventListener('change',e=>{
 if(e.target.classList&&e.target.classList.contains('coverin')&&e.target.files[0]){const im=new Image();im.onload=()=>{const q=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*q;c.height=im.height*q;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.covers=Object.assign({},S.covers,{[S.msrc]:c.toDataURL('image/jpeg',.82)});S.tones=Object.assign({},S.tones,{[S.msrc]:pictureTone(c)});save();render();toast('Picture updated for this music app.')};im.onerror=()=>toast('This picture could not be opened. Try another one.');im.src=URL.createObjectURL(e.target.files[0]);return}
 if(e.target.id!=='photo'||!e.target.files[0])return;
 const img=new Image();
 img.onload=()=>{const r=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.photo=c.toDataURL('image/jpeg',.78);S.theme='custom';S.wall='photo';save();render();toast('Wallpaper updated.')};
 img.onerror=()=>toast('This photo could not be opened. Try another one.');
 img.src=URL.createObjectURL(e.target.files[0]);
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('thumb')){e.preventDefault();e.target.click()}});
function pictureTone(c){const t=document.createElement('canvas');t.width=t.height=24;const x=t.getContext('2d');x.drawImage(c,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let best=null,bs=-1;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?(mx-mn)/mx:0,score=sat*(mx>70&&mx<235?1:.3);if(score>bs){bs=score;best=[r,g,b]}}const hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');return [hex(best.map(v=>v+(255-v)*.3)),hex(best.map(v=>v*.82))]}
let swipe=null;
document.addEventListener('pointerdown',e=>{if(full&&!sheet&&e.target.closest('.over'))swipe=[e.clientX,e.clientY]});
document.addEventListener('pointerup',e=>{if(!swipe||!full||S.carTab!=='phone'){swipe=null;return}const land=innerWidth>innerHeight,dx=land?e.clientX-swipe[0]:e.clientY-swipe[1],dy=land?e.clientY-swipe[1]:e.clientX-swipe[0];swipe=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){S.cur=(S.cur+(dx<0?1:-1)+S.screens.length)%S.screens.length;save();render()}});
render();startWeather();setInterval(startWeather,900000);
</script>
